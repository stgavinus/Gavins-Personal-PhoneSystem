services:

  asterisk:
    build: ./asterisk
    privileged: true
    ports:
      - "5062:5060/udp"        # SIP signaling
      - "5062:5060/tcp"
      - "10000-10020:10000-10020/udp"  # RTP media (21 ports, enough for several calls)
    volumes:
      - asterisk-spool:/var/spool/asterisk   # shared with ai-server for call files
      - wakeup-flags:/tmp/wakeup             # shared with ai-server for flag files
    restart: unless-stopped

  ai-server:
    build: ./ai-server
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models
      - asterisk-spool:/var/spool/asterisk   # write call files here
      - wakeup-flags:/tmp/wakeup             # check flag files here
      - ai-data:/app/data                    # web UI config persistence
    depends_on:
      - asterisk
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach native Ollama on Mac

volumes:
  asterisk-spool:
  wakeup-flags:
  ai-data:
