[general]

; ── Internal calls between extensions ────────────────────────────
[from-internal]
exten => 100,1,Dial(PJSIP/100,30)
exten => 100,n,Hangup()

exten => 101,1,Dial(PJSIP/101,30)
exten => 101,n,Hangup()

; ── Wakeup call entry point ───────────────────────────────────────
; Called by Asterisk call files via: Application=AGI / Data=wakeup.py,...
; The AGI script handles everything from here.
[wakeup]
exten => s,1,Answer()
exten => s,n,AGI(wakeup.py,${ARG1},${ARG2},${ARG3})
exten => s,n,Hangup()
